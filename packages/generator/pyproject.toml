[project]
name = "datapacto"
version = "0.1.0"
description = "Gera o ingestion.yml e o projeto PySpark de transformação a partir de um data contract (ODCS) ou DDL"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# Instalação básica: contrato, ingestion.yml e transformação, sem LLM
dependencies = [
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Nomenclatura por LLM (LiteLLM pela lib openai, ou qualquer provedor do LangChain)
llm = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
]
anthropic = ["datapacto[llm]", "langchain-anthropic>=0.3.0"]
aws = ["datapacto[llm]", "langchain-aws>=0.2.0"]
# Amostra (--sample) e arquivos de dados como entrada (.parquet, CSV de dados, registros JSON)
amostra = ["pandas>=2.0.0", "pyarrow>=15.0.0"]
ui = ["streamlit>=1.40", "datapacto[amostra]"]
all = ["datapacto[llm,amostra,ui]"]

[project.scripts]
datapacto = "datapacto.cli:main"
dl-gen = "datapacto.cli:main"  # nome antigo, mantido por compatibilidade

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datapacto = ["templates/**/*.j2", "templates/**/*.tpl", "templates/**/*.py", "templates/**/*.scala", "skills/**/*.md", "skills/**/*.txt", "skills/**/*.csv", "skills/**/*.scala"]
